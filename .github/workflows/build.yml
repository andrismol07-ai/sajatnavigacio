name: Android APK Fordito

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Kod letoltese
      uses: actions/checkout@v4

    - name: Python 3.10 beallitasa
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Rendszer-fuggosegek telepitese
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev python3-dev zip unzip zlib1g-dev openjdk-17-jdk

    - name: Buildozer es Cython telepitese
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.33

    - name: APK Forditasa
      run: |
        buildozer -s android debug

    - name: APK Letoltesi Link Letrehozasa
      uses: actions/upload-artifact@v4
      with:
        name: MagyarNavigacio-APK
        path: bin/*.apk
